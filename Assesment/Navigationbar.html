<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        nav{
            background-color: black;
            padding:15px;
        }
        ul{
            list-style:none;
            display:flex;
        }
        li{
            margin-right: 50px;
        }
        .loginbutton{
            background-color:rgb(85, 26, 139);
            padding:8px 16px;
            border-radius: 5px;
            
        }
        
    </style>
</head>
<body>
    <nav>
        <div>Logo</div>
        <ul>  
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><button class="loginbutton">Login</button></li>
        </ul>
        
    </nav>   
</body>
</html>
