<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tags </title>
</head>

<body>
    <!-- Paragraph -->
    <p>This is a paragraph tag.</p>

    <!-- Text Formatting -->
    <b>Bold Text</b><br>
    <strong>Strong Text</strong><br>
    <i>Italic Text</i><br>
    <em>Emphasized Text</em><br>
    <u>Underlined Text</u><br>
    <mark>Highlighted Text</mark><br>
    <small>Small Text</small><br>
    <del>Deleted Text</del><br>
    <ins>Inserted Text</ins><br>


    <p>H<sub>2</sub>O</p>
    <p>x<sup>2</sup></p>


    <!-- Implement Image and Anchor Tags Properly -->

    <h2>Image </h2>
    <img src="./image1.webp">

    <h2>Anchor Tag </h2>
    <a href="https://www.google.com" target="_blank">
        Visit Google
    </a>

    <!-- Practice Text Formatting and Webpage Structuring -->
    <!-- Text Formatting
     Text formatting is used to change the appearance of text and make content more readable and meaningful.
     <b> – Bold text
     <i> – Italic text
     <u> – Underlined text
     <strong> – Important text
     <em> – Emphasized text
     <mark> – Highlighted text
     <sub> – Subscript text (H₂O)
     <sup> – Superscript text (x²) 
        Webpage Structuring

    Webpage structuring means organizing the content of a webpage using HTML elements and semantic tags.
    <header> – Top section of the page
    <nav> – Navigation links
    <main> – Main content
    <section> – Content section
    <article> – Independent content
    <footer> – Bottom section of the page
        Purpose
    Text formatting improves the appearance and readability of content.
    Webpage structuring organizes content logically and makes webpages easier to understand, maintain, and navigate.
        -->
</body>

</html>
