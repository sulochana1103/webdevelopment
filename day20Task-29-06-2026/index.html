<html lang="en">

<head>

    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
    <!-- rel--relation(this is external css)  -->
    <style>
        .a {
            color: rgb(0, 0, 0);
        }

        #one {
            color: rgb(107, 9, 199);
        }

        * {
            color: aquamarine;
        }

        div>h1 {
            /*key value paairs  
            property name : value;*/
            color: rgb(223, 110, 36);
        }
    </style>
</head>

<body>
    <h1 style="color:aqua;border:1px black">This ia a Inline CSS</h1>

</body>

</html>
