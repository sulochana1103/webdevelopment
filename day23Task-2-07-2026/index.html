<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!-- Viewport Meta Tag -->
    <!-- To make a webpage responsive, include the viewport meta tag inside the <head> section.
        width=device-width → Sets the page width to the device width.
        initial-scale=1.0 → Sets the initial zoom level. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./index.css">
</head>

<body>
    <!-- Responsive Background Color -->
    <h1>Responsive Website</h1>

    <!-- Responsive Navigation Bar -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>

        <!-- Responsive Cards using Flexbox -->
        <div class="container">
            <div class="card">Card 1</div>
            <div class="card">Card 2</div>
            <div class="card">Card 3</div>

        </div>
    </nav>

    <!-- Responsive Grid Layout -->
    <div class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

    <div class="container">
    <h1>Responsive Breakpoints</h1>
    <p>Resize the browser window to see different layouts.</p>
</div>

</body>

</html>
